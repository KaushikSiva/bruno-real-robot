[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "summit-signal"
version = "0.1.0"
description = "Simulation-first, fail-closed PlayStation arm teleoperation for a gantry-supported Unitree G1"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
operator = ["pygame-ce==2.5.5"]
simulation = ["mujoco>=3.3.7,<4", "numpy>=1.26.4,<3", "pygame-ce==2.5.5"]
test = ["pytest==9.1.1"]

[project.scripts]
summit-signal-operator = "summit_signal.operator:main"
summit-signal-onboard = "summit_signal.onboard:main"
summit-signal-replay = "summit_signal.replay:main"
summit-signal-sim = "summit_signal.simulator:main"
summit-signal-smoke = "summit_signal.smoke:main"
summit-signal-prepare = "summit_signal.activation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/summit_signal"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
